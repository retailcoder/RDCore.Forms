name: Build and Deploy documentation site

on:
 push:
  branches: [main]
 pull_request:
  branches: [main]
 workflow_dispatch:

permissions:
 contents: read

# one deployment at a time; a run in progress finishes before the next starts.
concurrency:
 group: pages-${{ github.event_name }}-${{ github.ref }}
 cancel-in-progress: false

jobs:
 build-docs:
  runs-on: ubuntu-latest
  timeout-minutes: 30

  steps:
   - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
     with:
      persist-credentials: false

   # until the repository has a DocFX site, the site's root redirects to the repository.
   - name: Find the site
     id: site
     run: |
      if [ -f docs/docfx.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

   - name: Setup .NET
     if: steps.site.outputs.exists == 'true'
     uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
     with:
      dotnet-version: 11.0

   # the API metadata is read from both projects, so their packages, Avalonia's among them, are restored first.
   - name: Restore
     if: steps.site.outputs.exists == 'true'
     run: dotnet restore RDCore.Forms.slnx

   - name: Install DocFX
     if: steps.site.outputs.exists == 'true'
     run: dotnet tool update -g docfx

   # a pull request fails on a broken link or cross-reference; main publishes what it builds.
   - name: Build Docs (pull request)
     if: steps.site.outputs.exists == 'true' && github.event_name == 'pull_request'
     run: docfx docs/docfx.json --warningsAsErrors

   - name: Build Docs
     if: steps.site.outputs.exists == 'true' && github.event_name != 'pull_request'
     run: docfx docs/docfx.json

   - name: Redirect page
     if: steps.site.outputs.exists != 'true'
     env:
      TARGET: https://github.com/rubberduck-vba/RDCore.Forms
     run: |
      mkdir -p docs/_site
      printf '<!doctype html>\n<html lang="en"><head><meta charset="utf-8"><title>RDCore.Forms</title><meta http-equiv="refresh" content="0; url=%s"><link rel="canonical" href="%s"></head>\n<body><a href="%s">RDCore.Forms</a></body></html>\n' "$TARGET" "$TARGET" "$TARGET" > docs/_site/index.html

   - name: Upload Site
     if: github.event_name != 'pull_request'
     uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
     with:
      path: docs/_site

 deploy:
  if: github.event_name != 'pull_request'
  needs: build-docs
  runs-on: ubuntu-latest
  permissions:
   pages: write
   id-token: write
  environment:
   name: github-pages
   url: ${{ steps.deployment.outputs.page_url }}
  steps:
   - id: deployment
     uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

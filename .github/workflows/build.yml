name: Build and Test

# every push and pull request to main, and each Monday: an advisory published after the last push shows on main within a week. The scheduled
# run audits the packages and runs nothing else.
on:
 push:
  branches: [main]
 pull_request:
  branches: [main]
 schedule:
  - cron: '17 6 * * 1'

permissions:
 contents: read

jobs:
 # restore audits every package, the transitive ones included, against nuget.org's advisories of every severity (Directory.Build.props): in CI each
 # vulnerable package is an error NU1901-NU1904 that names it, its version and its advisory, and the run stops here, before any build. It needs no
 # repository setting.
 vulnerable-packages:
  runs-on: ubuntu-latest
  timeout-minutes: 10

  steps:
   - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
     with:
      persist-credentials: false

   - name: Setup .NET
     uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
     with:
      dotnet-version: 11.0

   - name: Vulnerable packages
     run: dotnet restore RDCore.Forms.slnx --force-evaluate

 build-and-test:
  needs: vulnerable-packages
  if: github.event_name != 'schedule'
  runs-on: ubuntu-latest
  timeout-minutes: 30

  steps:
   - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
     with:
      persist-credentials: false

   - name: Setup .NET
     uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
     with:
      dotnet-version: 11.0

   - name: Build (Debug)
     run: dotnet build RDCore.Forms.slnx --configuration Debug

   # the control tests run on Avalonia's headless platform, so the runner needs no display.
   # the tests, in a coverage collector: coverage.cobertura.xml, for the coverage badge.
   - name: Test (Debug) + coverage
     run: |
       dotnet tool install --global dotnet-coverage
       dotnet-coverage collect \
         "dotnet test RDCore.Forms.slnx --configuration Debug --no-build --verbosity normal" \
         --output-format cobertura --output coverage.cobertura.xml

   - name: Build (Release)
     run: dotnet build RDCore.Forms.slnx --configuration Release

   - name: Test (Release)
     run: dotnet test RDCore.Forms.slnx --configuration Release --no-build --verbosity normal

   # the badge files are written on every run, so a pull request's run shows them; only a push to main publishes them (the badge job).
   - name: Coverage badge
     run: |
       dotnet tool install --global dotnet-reportgenerator-globaltool
       # product code only: our own assemblies (not the tests, not the third-party ones that dotnet-coverage also
       # instruments), and none of the code generated at build time (resx designers, regex generators).
       reportgenerator -reports:coverage.cobertura.xml -targetdir:coverage-report \
         -reporttypes:JsonSummary \
         "-assemblyfilters:+RDCore.Forms;+RDCore.Forms.Avalonia" \
         "-filefilters:-*/obj/*;-*\\obj\\*"
       pct=$(grep -m1 -oE '"linecoverage": [0-9.]+' coverage-report/Summary.json | grep -oE '[0-9.]+$')
       echo "RDCore.Forms line coverage: ${pct}%"
       mkdir badge
       # one shields.io endpoint file per badge: the overall one, and one per project (coverage-<assembly>.json)
       badge() {
         n=${2%.*}
         if   [ "$n" -ge 80 ]; then color=brightgreen
         elif [ "$n" -ge 60 ]; then color=green
         elif [ "$n" -ge 40 ]; then color=yellowgreen
         elif [ "$n" -ge 25 ]; then color=yellow
         elif [ "$n" -ge 10 ]; then color=orange
         else color=red
         fi
         printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$2" "$color" > "badge/$1.json"
         echo "$1: $2%"
       }
       badge coverage "$pct"
       jq -r '.coverage.assemblies[] | "\(.name) \(.coverage)"' coverage-report/Summary.json | while read -r name value; do
         badge "coverage-$name" "$value"
       done

   - name: Upload coverage badges
     uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
     with:
      name: coverage-badges
      path: badge/*.json
      if-no-files-found: error
      retention-days: 7

 # the same runs on Windows and macOS. win-x64 runs for every pull request; osx-arm64 (macos-latest) runs on main only, where it
 # is too slow to hold a pull request up.
 build-and-test-os:
  needs: vulnerable-packages
  if: github.event_name != 'schedule'
  strategy:
   fail-fast: false
   matrix:
    os: ${{ fromJSON(github.event_name == 'push' && github.ref == 'refs/heads/main' && '["windows-latest", "macos-latest"]' || '["windows-latest"]') }}
  name: build-and-test (${{ matrix.os }})
  runs-on: ${{ matrix.os }}
  timeout-minutes: 30

  steps:
   - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
     with:
      persist-credentials: false

   - name: Setup .NET
     uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
     with:
      dotnet-version: 11.0

   - name: Build (Debug)
     run: dotnet build RDCore.Forms.slnx --configuration Debug

   - name: Test (Debug)
     run: dotnet test RDCore.Forms.slnx --configuration Debug --no-build --verbosity normal

   - name: Build (Release)
     run: dotnet build RDCore.Forms.slnx --configuration Release

   - name: Test (Release)
     run: dotnet test RDCore.Forms.slnx --configuration Release --no-build --verbosity normal

 # the only job that can write to the repo: it runs none of the repo's code, just pushes the badge files built above
 badge:
  needs: build-and-test
  if: github.event_name == 'push' && github.ref == 'refs/heads/main'
  runs-on: ubuntu-latest
  permissions:
   contents: write

  steps:
   - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
     with:
      name: coverage-badges
      path: badge

   - name: Publish coverage badge
     run: |
       git config --global user.name  'github-actions[bot]'
       git config --global user.email 'github-actions[bot]@users.noreply.github.com'
       tmp=$(mktemp -d)
       cp badge/*.json "$tmp/"
       cd "$tmp"
       git init -q
       git checkout -q -b badges
       git add ./*.json
       git commit -q -m 'coverage badge'
       git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" badges
